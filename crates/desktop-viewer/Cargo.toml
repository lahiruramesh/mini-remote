[package]
name = "remote-desktop-viewer"
version = "0.1.0"
edition = "2021"
description = "Tailscale-only remote desktop viewer"

[[bin]]
name = "remote-desktop-viewer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["persistence"] }
arboard = { version = "3.4", features = ["wayland-data-control"] }
remote-protocol = { path = "../protocol" }
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1", features = ["derive"] }
